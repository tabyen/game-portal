<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0908" />
    <title>Game Portal</title>
    <meta name="description" content="Small browser games. Pick a door." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect fill='%23140f0c' width='64' height='64'/%3E%3Crect x='26' y='14' width='12' height='22' rx='2' fill='%23c9a35a'/%3E%3Ccircle cx='32' cy='44' r='10' fill='%23e8c36a'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="hero">
      <div class="veil"></div>
      <div class="hero-copy">
        <p class="eyebrow">A handful of doors</p>
        <h1>Game Portal</h1>
        <p class="tagline">Small games, played in the browser. Pick a light and go in.</p>
      </div>
    </header>

    <main>
      <section class="shelf">
        <h2>On the shelf</h2>
        <p class="fine" id="status">Looking for games…</p>
        <div id="games" class="games"></div>
      </section>
    </main>

    <footer>
      <p>
        Source on
        <a href="https://github.com/tabyen/game-portal">GitHub</a>.
        Local servers show a second Play button when this page is opened from your machine.
      </p>
    </footer>

    <script type="module" src="js/portal.js"></script>
  </body>
</html>
